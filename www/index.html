<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FINNBALL</title>
    <meta
      name="description"
      content="FINNBALL — anime street basketball. Space-Jam energy, modern esports presentation. Built in Rust / Bevy."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        color: #e8f6ff;
        font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        /* A finger drag on a phone must never become pull-to-refresh, edge-swipe
           navigation, zoom or text selection — those all restart the game. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #errbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        display: none;
        max-height: 40vh;
        overflow: auto;
        padding: 10px 14px;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        color: #ffd6e7;
        background: rgba(40, 0, 20, 0.92);
        border-top: 2px solid #ff4eb6;
        white-space: pre-wrap;
        word-break: break-word;
        pointer-events: auto;
      }
      #errbar b {
        color: #2ef0ff;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 2;
        background: radial-gradient(ellipse at 50% 30%, #123 0%, #05070d 70%);
        pointer-events: none;
      }
      #boot h1 {
        font-size: clamp(42px, 8vw, 92px);
        letter-spacing: 0.18em;
        margin: 0;
        color: #2ef0ff;
        text-shadow: 0 0 24px #2ef0ff88;
      }
      #boot p {
        margin: 0;
        letter-spacing: 0.28em;
        font-size: 13px;
        color: #ff4eb6;
      }
      #boot .bar {
        width: min(320px, 70vw);
        height: 3px;
        background: #122;
        overflow: hidden;
        margin-top: 18px;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #2ef0ff, #ff4eb6);
        animation: slide 1.2s infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      canvas {
        outline: none;
        width: 100%;
        height: 100%;
        display: block;
        background: #05070d;
        touch-action: none;
      }
      #rotate {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border: 1px solid rgba(0, 229, 255, 0.6);
        border-radius: 8px;
        background: rgba(2, 4, 12, 0.78);
        color: #9ff;
        font: 13px/1.3 ui-monospace, Menlo, monospace;
        letter-spacing: 0.04em;
        pointer-events: none;
        z-index: 9;
        animation: rotate-fade 6s ease-in 1 forwards;
      }
      @keyframes rotate-fade {
        0%, 75% { opacity: 1; }
        100% { opacity: 0; }
      }
      @media (orientation: portrait) and (max-width: 600px) and (pointer: coarse) {
        #rotate { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>FINNBALL</h1>
      <p>ANIME STREET × THE COURT</p>
      <div class="bar"><i></i></div>
    </div>
    <canvas id="bevy"></canvas>
    <script>
      // Phones report a 3x devicePixelRatio; rendering an HDR scene at native
      // resolution there is what pushes iOS Safari over its memory limit and
      // gets the tab killed ("A problem repeatedly occurred"). winit sizes the
      // canvas backing store from devicePixelRatio, so capping it here renders
      // fewer pixels while the CSS size (and layout) stay the same.
      (function () {
        const ua = navigator.userAgent || "";
        const touch = (navigator.maxTouchPoints || 0) > 0;
        const phone = /iPhone|iPod|Android.*Mobile/i.test(ua) || (touch && Math.min(screen.width, screen.height) < 500);
        const tablet = !phone && (/iPad|Android/i.test(ua) || (touch && /Macintosh/.test(ua)));
        const cap = phone ? 1.5 : tablet ? 2 : 0;
        if (cap) {
          const real = window.devicePixelRatio || 1;
          const dpr = Math.min(real, cap);
          if (dpr < real) {
            Object.defineProperty(window, "devicePixelRatio", { get: () => dpr, configurable: true });
            window.__finnballDpr = { real, dpr };
          }
        }
      })();
    </script>
    <script>
      (function () {
        const events = ["click", "keydown", "pointerup", "touchend"];
        const AC = window.AudioContext || window.webkitAudioContext;
        const contexts = [];
        if (AC) {
          window.AudioContext = new Proxy(AC, {
            construct(Target, args) {
              const ctx = new Target(...args);
              contexts.push(ctx);
              return ctx;
            },
          });
        }
        function resume() {
          contexts.forEach((c) => c.state !== "running" && c.resume());
          if (contexts.length && contexts.every((c) => c.state === "running")) {
            events.forEach((e) => document.removeEventListener(e, resume));
          }
        }
        events.forEach((e) => document.addEventListener(e, resume));
      })();
    </script>
    <div id="rotate">Rotate your phone for the full court</div>
    <div id="errbar"></div>
    <script>
      (function () {
        const bar = document.getElementById("errbar");
        const lines = [];
        function show(kind, text) {
          if (!bar) return;
          const t = String(text || "").slice(0, 600);
          if (lines.some((l) => l.text === t)) return;
          lines.push({ kind, text: t });
          if (lines.length > 4) lines.shift();
          const esc = (x) => x.replace(/</g, "&lt;");
          bar.innerHTML =
            "<b>FINNBALL diagnostics</b> (tap to hide)\n" +
            lines.map((l) => "[" + l.kind + "] " + esc(l.text)).join("\n") +
            "\n<b>device</b> " + esc(navigator.userAgent);
          bar.style.display = "block";
        }
        if (bar) bar.addEventListener("pointerdown", () => (bar.style.display = "none"));
        window.__finnballShow = show;

        // If the previous page load reloaded itself, say why.
        const last = localStorage.getItem("finnball-last-reload");
        localStorage.removeItem("finnball-last-reload");
        const nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        if (last && nav && nav.type === "reload") show("reloaded", last);

        // A stale finnball.js or finnball_bg.wasm from an earlier deploy makes the
        // game render but throw on every input event. Exact signatures only: old
        // glue calling exports the new wasm no longer has, or new glue indexing a
        // closure table the old wasm does not have.
        const STALE =
          /__wbindgen_func_elem_\d+ is not a function|wasm\.__wbindgen_export\d* is (undefined|not a function)|reading '__wbindgen|table index is out of bounds|Table\.get\(\): invalid/i;
        const KEY = "finnball-refetched";
        let healing = false;
        async function heal(reason) {
          if (healing) return;
          if (sessionStorage.getItem(KEY)) {
            show("stale client (already reloaded once this session)", reason);
            return;
          }
          healing = true;
          sessionStorage.setItem(KEY, String(Date.now()));
          localStorage.setItem("finnball-last-reload", "refreshed stale game files: " + reason);
          console.warn("FINNBALL: stale client detected (" + reason + "); refetching");
          try {
            await Promise.all(
              ["./game/finnball.js", "./game/finnball_bg.wasm"].map((u) =>
                fetch(u, { cache: "reload" })
              )
            );
          } catch (_) {}
          location.reload();
        }
        window.__finnballHeal = heal;
        window.__finnballStale = (m) => STALE.test(String(m || ""));

        function onError(msg) {
          const text = String(msg || "");
          if (STALE.test(text)) heal(text);
          else if (text && text !== "Script error.") show("error", text);
        }
        window.addEventListener("error", (e) => onError(e.message || (e.error && e.error.message)));
        window.addEventListener("unhandledrejection", (e) => {
          const r = e.reason;
          onError(r && r.message ? r.message : r);
        });
        // Rust panics arrive through console.error (console_error_panic_hook).
        const origError = console.error.bind(console);
        console.error = function () {
          const text = Array.from(arguments).map(String).join(" ");
          if (/panicked at|RuntimeError|unreachable/i.test(text)) show("panic", text);
          origError.apply(console, arguments);
        };
        // Record when the browser (not the game) tears the page down, e.g. a
        // pull-to-refresh or a memory kill, so the next load can say so.
        window.addEventListener("pagehide", () => {
          if (!healing) {
            localStorage.setItem(
              "finnball-last-reload",
              "the browser closed or reloaded the page (pull-to-refresh, back-swipe, or memory) at " + new Date().toISOString()
            );
          }
        });
      })();
    </script>
    <script type="module">
      const boot = document.getElementById("boot");
      try {
        const mod = await import("./game/finnball.js");
        await mod.default();
        if (boot) boot.style.opacity = "0";
        setTimeout(() => boot?.remove(), 700);
        // Keyboard events only reach the game while the canvas is focused; make
        // sure it is, both on boot and after any tap/click on the page.
        const canvas = document.getElementById("bevy");
        if (canvas) {
          canvas.setAttribute("tabindex", "0");
          canvas.focus({ preventScroll: true });
          window.addEventListener("pointerdown", () => canvas.focus({ preventScroll: true }));
        }
      } catch (err) {
        console.error(err);
        const stale = window.__finnballStale && window.__finnballStale(err);
        if (stale) {
          await window.__finnballHeal(String(err));
        } else if (boot) {
          if (window.__finnballShow) window.__finnballShow("boot failed", String(err));
          boot.innerHTML = `
            <h1>FINNBALL</h1>
            <p>WEB BUILD NOT ATTACHED YET</p>
            <p style="color:#e8f6ff;letter-spacing:0.08em;max-width:520px;text-align:center;line-height:1.6">
              Native: <code>cargo run --release</code><br/>
              Browser: <code>./scripts/build-web.sh</code> then host <code>www/</code><br/>
              Live host: Railway (Dockerfile + nginx serving this WebGL client).
            </p>`;
        }
      }
    </script>
  </body>
</html>
