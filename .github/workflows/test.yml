name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: test
        run: cargo test --offline || cargo test
