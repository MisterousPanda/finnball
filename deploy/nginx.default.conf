server {
    listen LISTEN_PORT default_server;
    listen [::]:LISTEN_PORT default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm application/json;

    # The JS glue and the .wasm are generated as a matched pair; if a browser keeps
    # one of them from a previous deploy the page renders but every event closure
    # throws (`__wbindgen_func_elem_* is not a function`). Everything the game
    # loads therefore revalidates on each visit (ETag/Last-Modified → cheap 304s).
    location ~* \.wasm$ {
        default_type application/wasm;
        etag on;
        add_header Cache-Control "no-cache";
    }

    # Game assets must 404 when missing; the SPA fallback would hand Bevy an HTML page.
    location ~ ^/(assets|game|pkg)/ {
        try_files $uri =404;
        etag on;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
